# SPDX-License-Identifier: GPL-3.0-or-later
# Stable releases: push a tag vMAJOR.MINOR.PATCH that matches Info.plist.
# Unsigned by default. Developer ID signing + notarization turn on automatically
# when the signing secrets exist (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build and package
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      NOTARIZE: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_TEAM_ID != '' && secrets.NOTARY_APP_PASSWORD != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history and tags for release notes
          persist-credentials: false

      - name: Validate tag and version
        id: version
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${BASH_REMATCH[1]}"
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Stitchy/Resources/Info.plist)"
          if [[ "$plist" != "$version" ]]; then
            echo "::error::Tag $TAG doesn't match CFBundleShortVersionString $plist in Stitchy/Resources/Info.plist. Bump it, commit, then tag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file_version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (signing: $SIGNING, notarization: $NOTARIZE)"

      - name: Select Xcode
        run: Scripts/ci/select-xcode.sh

      - name: Run tests
        run: Scripts/test.sh

      - name: Import Developer ID certificate
        if: env.SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_password="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_password"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain" | grep -qF "$IDENTITY" \
            || { echo "::error::MACOS_SIGNING_IDENTITY wasn't found in the imported certificate"; exit 1; }
          case "$IDENTITY" in "Developer ID Application:"*) ;; *) echo "::error::Direct distribution needs a 'Developer ID Application' identity"; exit 1 ;; esac

      - name: Build Stitchy.app
        env:
          STITCHY_BUILD_VERSION: ${{ steps.version.outputs.version }}
          STITCHY_BUILD_CHANNEL: stable
          STITCHY_BUILD_COMMIT: ${{ github.sha }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING" == "true" ]]; then
            STITCHY_SIGN_IDENTITY="$IDENTITY" STITCHY_HARDENED=1 Scripts/build-app.sh
          else
            Scripts/build-app.sh     # ad-hoc signature: unsigned for distribution purposes
          fi
          codesign --verify --strict --verbose=2 build/Stitchy.app
          codesign -dv build/Stitchy.app 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature)' || true

      - name: Package DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/make-dmg.sh --version "$VERSION" --out build/dist

      - name: Sign, notarize and staple the DMG
        if: env.SIGNING == 'true' && env.NOTARIZE == 'true'
        env:
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          dmg="build/dist/Stitchy-$FILE_VERSION-arm64.dmg"
          codesign --force --sign "$IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          (cd build/dist && shasum -a 256 "${dmg:t}" > "${dmg:t}.sha256")   # stapling changed the file
        shell: zsh {0}

      - name: Release notes and metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)"
          range="${previous:+$previous..}$TAG"
          signed=false; notarized=false
          [[ "$SIGNING" == "true" ]] && signed=true
          [[ "$SIGNING" == "true" && "$NOTARIZE" == "true" ]] && notarized=true
          {
            echo "## What's changed"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            echo
            if [[ -n "$previous" ]]; then echo "**Full changelog:** $REPO_URL/compare/$previous...$TAG"; echo; fi
            echo "## Install"
            echo
            echo "Requires macOS 14 Sonoma or later on Apple silicon. Open the DMG and drag Stitchy into Applications."
            echo
            if [[ "$notarized" != "true" ]]; then
              echo "> [!IMPORTANT]"
              echo "> This build is **not signed with an Apple Developer ID and not notarized**. macOS will block it the first time."
              echo "> Open it from System Settings › Privacy & Security › **Open Anyway**, or run:"
              echo "> \`xattr -dr com.apple.quarantine /Applications/Stitchy.app\`"
              echo
            fi
            echo "SHA-256: \`$(cut -d' ' -f1 < "build/dist/Stitchy-$FILE_VERSION-arm64.dmg.sha256")\`"
          } > build/dist/release-notes.md
          jq -n --arg version "$VERSION" --arg commit "$SHA" --arg tag "$TAG" --arg previous "$previous" \
                --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson signed "$signed" --argjson notarized "$notarized" \
                --arg xcode "$(xcodebuild -version | head -1)" \
                '{channel: "stable", stable: true, version: $version, tag: $tag, previous_tag: $previous, commit: $commit,
                  built_at: $built_at, signed: $signed, notarized: $notarized, xcode: $xcode,
                  minimum_macos: "14.0", architecture: "arm64"}' > build/dist/build-info.json
          cat build/dist/release-notes.md build/dist/build-info.json

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.file_version }}
          path: |
            build/dist/Stitchy-${{ steps.version.outputs.file_version }}-arm64.dmg
            build/dist/Stitchy-${{ steps.version.outputs.file_version }}-arm64.dmg.sha256
            build/dist/build-info.json
            build/dist/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove signing keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
      FILE_VERSION: ${{ needs.build.outputs.file_version }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.file_version }}
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $VERSION"; exit 1; }
          dmg="dist/Stitchy-$FILE_VERSION-arm64.dmg"
          for f in "$dmg" "$dmg.sha256" dist/build-info.json dist/release-notes.md; do
            [[ -f "$f" ]] || { echo "::error::missing $f"; exit 1; }
          done
          (cd dist && sha256sum --check "Stitchy-$FILE_VERSION-arm64.dmg.sha256")
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "Stitchy $VERSION" \
            --notes-file dist/release-notes.md "$dmg" "$dmg.sha256" dist/build-info.json
