name: Bug report
description: Something in Stitchy doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the island
        2. …
  - type: input
    id: version
    attributes:
      label: Stitchy version
      description: From the DMG file name or the release page. Say if it's a nightly build.
      placeholder: 1.3.0 or 1.3.0-nightly.20261126+abcdef1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.5, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Optional. Run `log stream --predicate 'subsystem == \"app.stitchy.Stitchy\"' --level info` while reproducing."
      render: text
