name: Feature request
description: Suggest an idea for Stitchy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working in the island.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Similar apps, screenshots, or limits you know about (permissions, APIs).
